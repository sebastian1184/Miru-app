name: Build Web App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Upload Page Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app-files
        path: index.html
