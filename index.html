<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miru - Visual Search</title>
    <style>
        body {
            background-color: #0b091a;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
            font-size: 2.5rem;
        }
        p {
            color: #a78bfa;
            font-size: 1.1rem;
        }
        .card {
            background: rgba(20, 15, 38, 0.9);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            max-width: 400px;
            margin: 30px auto;
        }
        .btn {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #0b091a;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>
    <h1>MIRU</h1>
    <p>Identificación de Microseries y Búsqueda Visual</p>
    
    <div class="card">
        <h3>Estado del Sistema</h3>
        <p>Núcleo Cyberpunk Activo ⚡</p>
        

    </div>
</body>
</html>
