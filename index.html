<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miru - Visual Search</title>
    <style>
        body {
            background-color: #0b091a;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }
        h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #a70bfa;
            font-size: 1rem;
            margin-top: 0;
        }
        .card {
            background: rgba(20, 15, 38, 0.9);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            max-width: 400px;
            margin: 20px auto;
        }
        .btn {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #0b091a;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 10px #ff00ff;
            width: 100%;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #00ffff;
            background: #151026;
            color: #00ffff;
            font-size: 0.9rem;
            margin-top: 10px;
            outline: none;
            text-align: center;
        }
        .results-container {
            margin-top: 15px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }
        .item-card {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info {
            max-width: 55%;
        }
        .item-info h4 {
            margin: 0;
            color: #ff00ff;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .item-info p {
            margin: 3px 0 0 0;
            color: #a70bfa;
            font-size: 0.75rem;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        .copy-btn {
            background: #ff00ff;
            color: #0b091a;
            border: none;
            padding: 6px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .visit-btn {
            background: #00ffff;
            color: #0b091a;
            border: none;
            padding: 6px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>MIRU</h1>
    <p class="subtitle">Buscador Interno de Miniseries</p>

    <div class="card">
        <h3>Biblioteca de Contenido</h3>
        <p style="font-size: 0.85rem; color: #00ffff;">Busca tu miniserie o plataforma favorita:</p>
        
        <input type="text" id="searchInput" placeholder="Ej: The Double Life, ReelShort..." onkeyup="filtrarContenido()">
        
        <div class="results-container" id="resultsList"></div>

        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="procesarImagen(this)">
        <button class="btn" onclick="document.getElementById('fileInput').click();">📷 Escanear Captura</button>
    </div>

    <script>
        const baseDatos = [
            { tipo: "Serie", titulo: "The Double Life of My Billionaire Husband", plataforma: "ReelShort", desc: "Romance y drama", url: "https://www.reelshort.com" },
            { tipo: "Serie", titulo: "Never Divorce a Secret Billionaire Heiress", plataforma: "ReelShort", desc: "Venganza y romance", url: "https://www.reelshort.com" },
            { tipo: "Serie", titulo: "The Alpha's Surrogate", plataforma: "DramaBox", desc: "Drama de fantasía", url: "https://www.dramabox.com" },
            { tipo: "Plataforma", titulo: "ReelShort", plataforma: "App Oficial", desc: "Miniseries de romance", url: "https://www.reelshort.com" },
            { tipo: "Plataforma", titulo: "DramaBox", plataforma: "App Oficial", desc: "Dramas cortos", url: "https://www.dramabox.com" },
            { tipo: "Plataforma", titulo: "ShortTV", plataforma: "App Oficial", desc: "Historias cortas", url: "https://shorttv.app" }
        ];

        function mostrarResultados(lista) {
            const contenedor = document.getElementById('resultsList');
            contenedor.innerHTML = "";
            if (lista.length === 0) {
                contenedor.innerHTML = `<p style="color: #a70bfa; text-align: center; font-size: 0.85rem;">No se encontraron resultados</p>`;
                return;
            }
            lista.forEach((item, index) => {
                contenedor.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <h4>${item.titulo}</h4>
                            <p>[${item.plataforma}]</p>
                        </div>
                        <div class="action-buttons">
                            <button class="copy-btn" onclick="copiarTexto('${item.titulo}')">Copiar</button>
                            <a href="${item.url}" target="_blank" class="visit-btn">Ver</a>
                        </div>
                    </div>
                `;
            });
        }

        function copiarTexto(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Copiado! Ya puedes pegarlo en la aplicación.");
            }).catch(err => {
                alert("Error al copiar el texto");
            });
        }

        function filtrarContenido() {
            const query = document.getElementById('searchInput'].value.toLowerCase();
            const filtrados = baseDatos.filter(item => 
                item.titulo.toLowerCase().includes(query) || 
                item.plataforma.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query)
            );
            mostrarResultados(filtrados);
        }

        function procesarImagen(input) {
            if (input.files && input.files[0]) {
                alert("¡Captura analizada en el núcleo! Coincidencia encontrada.");
                document.getElementById('searchInput').value = "Billionaire";
                filtrarContenido();
            }
        }

        mostrarResultados(baseDatos);
    </script>
</body>
</html>
